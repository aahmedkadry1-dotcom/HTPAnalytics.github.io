.comp i{display:block;height:100%}
.comp-l{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;font:500 12px/1 var(--f);color:var(--ink2)}
.comp-l span{display:flex;align-items:center;gap:6px}
.comp-l s{width:8px;height:8px;border-radius:50%;display:block}
.mflags{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mflags button{display:grid;justify-items:center;gap:6px;padding:10px 4px 8px;border:0;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);font:600 12px/1 var(--f);transition:transform .25s var(--ease)}
.mflags img{width:30px;height:20px;display:block;border-radius:3px;box-shadow:0 0 0 .5px rgba(0,0,0,.2)}
.mflags button:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--red)}
.search{display:flex;align-items:center;gap:8px;height:38px;border-radius:11px;background:rgba(118,118,128,.12);padding:0 11px;margin-top:16px;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;outline:0;font:400 14px/1 var(--f);background:none;color:var(--ink)}
.search:focus-within{box-shadow:0 0 0 3px rgba(230,0,0,.2)}
.nores{font:400 13px/1.4 var(--f);color:var(--mute);padding:16px 0}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.val{padding:14px;background:var(--card);border-radius:var(--r2);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.val svg{color:var(--red)}
.val b{display:block;font:700 13px/1 var(--f);margin:10px 0 5px;letter-spacing:-.01em;text-transform:capitalize}
.val p{font:400 12px/1.4 var(--f);color:var(--mute)}
.steps{list-style:none;background:var(--card);border-radius:var(--r2);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);padding:0 14px}
.steps li{display:grid;grid-template-columns:34px 1fr;padding:11px 0;align-items:start}
.steps li+li{border-top:.5px solid var(--sep)}
.steps em{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:700 11px/1 var(--f);font-style:normal}
.steps b{font:600 13.5px/1.3 var(--f);text-transform:capitalize}
.steps p{font:400 12px/1.4 var(--f);color:var(--mute);margin-top:2px}
.p-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border-top:.5px solid var(--sep)}
.p-foot button{height:50px;border:0;border-radius:12px;background:rgba(0,0,0,.04);text-align:left;padding:0 14px;display:grid;align-content:center;gap:3px;transition:background .2s}
.p-foot button+button{text-align:right}
.p-foot span{font:500 11px/1 var(--f);color:var(--mute)}
.p-foot b{font:600 13px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-foot button:hover{background:rgba(0,0,0,.08)}
#loader{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s var(--ease)}
#loader img{height:64px;width:auto}
#loader h2{font:700 40px/1 var(--f);letter-spacing:-.04em}
#loader p{font:500 15px/1 var(--f);color:var(--mute);margin-top:-8px}
#loader .bar{width:180px;height:4px;border-radius:999px;background:rgba(0,0,0,.08);position:relative;overflow:hidden;margin-top:6px}
#loader .bar:after{content:'';position:absolute;inset:0;width:40%;border-radius:999px;background:var(--red);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (max-width:900px){#side,#hint,#legend{display:none}}
@media (max-height:740px){.brand .facts{display:none}}
@media (max-height:640px){.brand .sub{display:none}}
@media (prefers-reduced-transparency:reduce){#side,#panel,#legend,#hint,.lbl{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}

<div id="stage"></div>

<aside id="side">

    <h1>HTP Analytics</h1>
    <p class="sub">Turning connectivity data into actionable insights</p>

  </div>
  <nav id="idx"></nav>
  <div class="side-foot">

  </div>

<div id="legend"></div>
<div id="tip"></div>

<aside id="panel" aria-live="polite">

  <div class="p-body" id="pbody"></div>
  <div class="p-foot"><button id="prev"><span>Previous</span><b></b></button><button id="next"><span>Next</span><b></b></button></div>
</aside>

<script type="module">
import * as THREE from 'three';

const TARGET = CFG.linkTarget || '_blank';

/* ---------- Icons (Lucide) ---------- */
const IC = {

 dash:[['rect',3,3,7,9,1],['rect',14,3,7,5,1],['rect',14,12,7,9,1],['rect',3,16,7,5,1]],
 arrowUR:[['p','M7 7h10v10'],['p','M7 17 17 7']],

 home:[['p','M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8'],['p','M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z']],
 shield:[['p','M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z']],

const svg = (k,s=16,sw=2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[k].map(([t,...a])=>t==='p'?`<path d="${a[0]}"/>`:t==='rect'?`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" rx="${a[4]||0}"/>`:t==='c'?`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}"/>`:`<ellipse cx="${a[0]}" cy="${a[1]}" rx="${a[2]}" ry="${a[3]}"/>`).join('')}</svg>`;

/* ---------- Flags ---------- */
const FL = {
 DE:(x,w,h)=>{['#000000','#dd0000','#ffce00'].forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,i*h/3,w,h/3+1);});},
 IE:(x,w,h)=>{['#169b62','#ffffff','#ff883e'].forEach((c,i)=>{x.fillStyle=c;x.fillRect(i*w/3,0,w/3+1,h);});},

 CZ:(x,w,h)=>{x.fillStyle='#ffffff';x.fillRect(0,0,w,h/2);x.fillStyle='#d7141a';x.fillRect(0,h/2,w,h/2);x.fillStyle='#11457e';x.beginPath();x.moveTo(0,0);x.lineTo(w/2,h/2);x.lineTo(0,h);x.fill();},
 GR:(x,w,h)=>{const s=h/9;for(let i=0;i<9;i++){x.fillStyle=i%2?'#ffffff':'#0d5eaf';x.fillRect(0,i*s,w,s+.5);}x.fillStyle='#0d5eaf';x.fillRect(0,0,s*5,s*5);x.fillStyle='#ffffff';x.fillRect(0,s*2,s*5,s);x.fillRect(s*2,0,s,s*5);},

const flagCanvas = (k,w=300,h=200) => { const c=document.createElement('canvas'); c.width=w; c.height=h; FL[k](c.getContext('2d'),w,h); return c; };

/* ---------- Content ---------- */
const CATS = [
 {id:'app', name:'App', icon:'smartphone', img:'assets/photo-red.png', cover:true, short:'Home App and Phoenix App usage, stability and journeys.', blurb:'Usage, stability and user journeys for the Home App and Phoenix App, with per-market Home App dashboards.', q:['How is the Home App being used in each market?','How stable is the app across releases?','Where do users drop out of key journeys?'],

  supporting:[['Phoenix App','Phoenix App summary','Phoenix App']],
  groups:[{name:'Home App',desc:'Home App summary by market',markets:['UK','DE','IE','PT','CZ']},{name:'Users Funnel',desc:'User journey through the app',markets:['UK','DE']}]},
 {id:'new', name:'New Services', icon:'sparkles', img:'assets/photo-iso.png', short:'Adoption and usage of newly launched home services.', blurb:'Adoption and usage of newly launched home services, from beta trial onwards.', q:['Which new services are customers adopting?','How are EcoMode and Smart Modes used?','How does usage develop after launch?'],
  featured:[['EcoMode','EcoMode beta trial adoption','EcoMode'],['Smart Modes','Smart Modes beta trial analysis','Smart Modes']],
  supporting:[['Smart Motion','Smart Motion beta trial adoption','Smart Motion'],['Smartphone Backup','Smartphone Backup analysis','Smartphone Backup'],["Who's Home UK","Who's Home engagement in the UK","Who's Home UK"]], groups:[]},
 {id:'who', name:"Who's Home", icon:'users', short:"Engagement reporting for the Who's Home service.", blurb:"Engagement reporting for the Who's Home service, currently live in the UK.", q:["How are customers engaging with Who's Home?",'How does engagement change over time?'],
  featured:[["Who's Home Dashboard UK","Who's Home engagement in the UK","Who's Home UK"]], supporting:[], groups:[]},
 {id:'hubs', name:'Hubs & Extenders', icon:'router', img:'assets/hubs-v2.png', short:'Hubs and extenders dashboards, one per market.', blurb:'Hubs and extenders reporting, with one dashboard per market. Technical performance has its own per-market dashboards.', q:['How are hubs and extenders performing in each market?','How do markets compare?'],
  featured:[], supporting:[], groups:[{name:'Hubs & Extenders',desc:'Market dashboard',markets:['UK','DE','IE','PT','CZ','GR']}], related:['tech']},
 {id:'tech', name:'Technical Performance', icon:'activity', short:'Hubs technical performance, one dashboard per market.', blurb:'Technical performance of hubs, including activations, with one dashboard per market.', q:['How are hubs performing technically?','How are activations trending?','How do markets compare?'],
  featured:[], supporting:[], groups:[{name:'Technical Performance',desc:'Hubs technical performance',markets:['UK','DE','IE','PT','CZ','GR']}], related:['hubs']}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const gN = c => c.groups.reduce((s,g)=>s+g.markets.length,0);
const cnt = c => c.featured.length + c.supporting.length + gN(c);

  {title:'Scorecards',items:[['Health','Scorecard','Digital Security / Health','To be implemented'],['SN - Happiness Dashboard','Customer happiness','Digital Security / SN - Happiness Dashboard'],['SN - Customer Engagement','Customer engagement','Digital Security / SN - Customer Engagement'],['Revenue &amp; Customer Base','Secure Net revenue and customer base','Digital Security / Revenue & Customer Base']]},
  {title:'Features',items:[['Digital Security Features','Feature usage across security products','Digital Security / Features']]}]},

/* ---------- Panel ---------- */
const openLink = (k, status) => { const u = link(k); return u ? `<a class="open" href="${u}" target="${TARGET}" rel="noopener">Open ${svg('arrowUR',13,2.4)}</a>` : `<span class="pending">${status||'Link pending'}</span>`; };
const row = (name, desc, key, icon='dash', img, status) => `<div class="row" data-s="${(name+' '+desc).toLowerCase().replace(/&amp;/g,'&')}"><span class="ri">${img?`<img src="${img}" alt="">`:svg(icon,16)}</span><div><h5>${name}</h5><p>${desc}</p></div>${openLink(key,status)}</div>`;
function catalogueHTML(){

 return `

  ${Object.values(DOMAINS).filter(d=>d.groups.length).map(d=>grp(d.name,dN(d),d.groups.map(g=>g.items.map(i=>row(i[0],`${g.title} · ${i[1]}`,i[2],d.icon,null,i[3])).join('')).join(''))).join('')}

}
document.addEventListener('input', e => { if(e.target.id!=='q') return; const v=e.target.value.trim().toLowerCase(); let any=false;
 document.querySelectorAll('#pbody .grp').forEach(g=>{ let n=0; g.querySelectorAll('.row').forEach(r=>{ const m=!v||r.dataset.s.includes(v); r.hidden=!m; if(m) n++; }); g.hidden=!n; if(n) any=true; });
 document.getElementById('nores').hidden=any; });
const navRow = (id, icon, name, desc, extra='') => `<button class="row" data-go="${id}"><span class="ic">${svg(icon,15)}</span><div><h5>${name}</h5><p>${desc}</p></div><span class="go">${extra}${svg('arrowR',15)}</span></button>`;
const h3 = (t, r='') => `<div class="h3">${t}<span>${r}</span></div>`;

const mcell = (code, key) => { const u=link(key); const inner=`<div class="r"><img src="${FLAG_URL[code]}" alt=""><span>${u?svg('arrowUR',13,2.4):''}</span></div><b>${code}</b><span>${u?MK[code]:'Link pending'}</span>`; return u?`<a class="mcell" href="${u}" target="${TARGET}" rel="noopener">${inner}</a>`:`<div class="mcell">${inner}</div>`; };
const cntTag = n => `<em style="font:600 11px var(--f);font-style:normal;margin-right:8px">${n}</em>`;

function panelHTML(id){
 if(id==='catalogue') return catalogueHTML();
 if(id==='core') return `
  <div class="kick">Overview</div>
  <div class="p-title"><div class="p-icon">${svg('chart',24)}</div><h2>HTP Analytics</h2></div>
  <div class="hero"><img src="assets/photo-iso.png" alt=""></div>
  <p class="p-blurb">Analytics, reporting and data products across Vodafone Home Technology &amp; Products.</p>
  ${stats([[TOTAL,'Dashboards'],[CATS.length,'Categories'],[MK_ORDER.length,'Markets']])}
  ${h3('Dashboards by category',TOTAL)}

  const hs=[2.2,3.6,2.8,5.2,4.2]; const bars=hs.map((h,i)=>{ const g=B(1,1,1); g.translate(0,.5,0); const m=part(Z,g,i===3?M.red:M.white,-2.8+i*1.4,.4,0,i===3?{edges:false}:{}); m.scale.y=h; return m; });
  const lg=new THREE.BufferGeometry().setFromPoints(hs.map((h,i)=>new THREE.Vector3(-2.8+i*1.4,.4+h+.5,0)));
  const line=new THREE.Line(lg,new THREE.LineBasicMaterial({color:0x25282b})); Z.inner.add(line);
  anims.push(t => { const p=lg.attributes.position; bars.forEach((b,i)=>{ b.scale.y = hs[i]*(1+.12*Math.sin(t*1.4+i)); p.setY(i,.4+b.scale.y+.5); }); p.needsUpdate=true; }); }

/* Markets */
const flagMeshes = [];
MK_ORDER.forEach((k,i)=>{
 const x=-25+i*10; const Z=makeZone('m-'+k,x,1,-27,7,24,`<img src="${FLAG_URL[k]}" alt="">${k}`,new THREE.Vector3(0,8.6,0));
 part(Z,B(3.2,.4,3.2),M.white,0,.2,0);
 part(Z,new THREE.CylinderGeometry(.09,.09,6.8,12),M.ink,-1.5,3.8,0,{edges:false});
 part(Z,B(.3,.3,.3),M.red,-1.5,7.3,0,{edges:false});
 const tex=new THREE.CanvasTexture(flagCanvas(k)); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4;
 const fg=new THREE.PlaneGeometry(3,2,18,4); fg.translate(1.5,0,0);
 const fm=part(Z,fg,new THREE.MeshStandardMaterial({map:tex,side:THREE.DoubleSide,roughness:.9}),-1.5,6.1,0,{edges:false});
 flagMeshes.push({g:fg,base:fg.attributes.position.array.slice(),ph:i});
});
anims.push(t => flagMeshes.forEach(f=>{ const p=f.g.attributes.position; for(let j=0;j<p.count;j++){ const x=f.base[j*3]; p.setZ(j,Math.sin(x*2.2-t*3+f.ph)*.13*(x/3)); } p.needsUpdate=true; f.g.computeVertexNormals(); }));

/* Data flows */
const flowGroup = new THREE.Group(); flowGroup.visible = false; scene.add(flowGroup);
const flows = [];
const addFlow = (a,c,b,red) => { const cv=new THREE.QuadraticBezierCurve3(a,c,b); const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(cv.getPoints(48)),new THREE.LineDashedMaterial({color:red?0xf0a0a0:0xbababa,dashSize:.5,gapSize:.45})); ln.computeLineDistances(); flowGroup.add(ln); flows.push({cv,red,ph:Math.random()}); };
MK_ORDER.forEach((k,i)=>{ const x=-25+i*10; addFlow(new THREE.Vector3(x,1.6,-27),new THREE.Vector3(x*.5,10,-17),new THREE.Vector3(0,4,-6),false); });
[-24,-12,0,12,24].forEach(x=> addFlow(new THREE.Vector3(0,13.6,-6),new THREE.Vector3(x*.5,18,4),new THREE.Vector3(x,9.2,15),true));
const PER = 5, pg = B(.32,.32,.32);
const inkI = new THREE.InstancedMesh(pg,new THREE.MeshBasicMaterial({color:0x25282b}),flows.filter(f=>!f.red).length*PER);
const redI = new THREE.InstancedMesh(pg,new THREE.MeshBasicMaterial({color:0xe60000}),flows.filter(f=>f.red).length*PER);
flowGroup.add(inkI, redI);
const dummy = new THREE.Object3D();
anims.push(t => { if(!flowGroup.visible) return; let a=0,b=0; flows.forEach(f=>{ for(let k=0;k<PER;k++){ const u=(t*.11+k/PER+f.ph)%1; dummy.position.copy(f.cv.getPoint(u)); dummy.rotation.set(t*2,t*2,0); const s=Math.sin(u*Math.PI); dummy.scale.setScalar(.5+s*.7); dummy.updateMatrix(); if(f.red) redI.setMatrixAt(b++,dummy.matrix); else inkI.setMatrixAt(a++,dummy.matrix); } }); inkI.instanceMatrix.needsUpdate=redI.instanceMatrix.needsUpdate=true; });

/* ---------- Camera & interaction ---------- */
const OV_T = new THREE.Vector3(0,2,-3);
const sphPos = (t,r,phi,th) => t.clone().add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(r,phi,th)));
const OV_P = sphPos(OV_T,104,.95,.5);
camera.position.copy(sphPos(OV_T,190,.4,-.5)); controls.target.copy(OV_T);
let tween = null, selected = null, hoverId = null, hoverLbl = null, lastInteract = 0, offCur = 0;
const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
const flyTo = (p,t,dur=1200) => { tween = { p0:camera.position.clone(), t0:controls.target.clone(), p1:p, t1:t, s:performance.now(), dur }; };
controls.addEventListener('start', () => { lastInteract = performance.now(); tween = null; });

function focus(id){
 const Z = zones[id]; const t = Z.g.position.clone(); t.y += Math.max(1.5, Z.height*.45);
 const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
 sph.radius = Z.dist; sph.phi = THREE.MathUtils.clamp(sph.phi,.8,1.05);
 flyTo(t.clone().add(new THREE.Vector3().setFromSpherical(sph)), t);
}
const panel = $('#panel');
function select(id){
 if(id==='overview') return overview();
 if(id!=='catalogue' && !zones[id]) return;
 hideTip();
 selected = id;
 $('#pbody').innerHTML = panelHTML(id); $('#pbody').scrollTop = 0;
 $('#crumbs').innerHTML = crumbs(id);
 const i = ORDER.indexOf(id), pv = ORDER[(i-1+ORDER.length)%ORDER.length], nx = ORDER[(i+1)%ORDER.length];
 $('#prev').dataset.go = pv; $('#prev b').textContent = '← '+nameOf(pv);
 $('#next').dataset.go = nx; $('#next b').textContent = nameOf(nx)+' →';
 panel.classList.add('is-open'); syncIndex();
 if(id==='catalogue') flyTo(OV_P.clone(), OV_T.clone(), 1200); else focus(id);
}
function overview(){ selected = null; panel.classList.remove('is-open'); syncIndex(); flyTo(OV_P.clone(), OV_T.clone(), 1400); }
function syncIndex(){ document.querySelectorAll('#idx [data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===selected)); }
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if(g){ e.preventDefault(); select(g.dataset.go); } });
$('#close').onclick = overview; $('#reset').onclick = overview;
$('#spin').onclick = () => { autoRot = !autoRot; setSpin(); lastInteract = 0; };
addEventListener('keydown', e => { if(e.key==='Escape') overview(); if(selected && e.key==='ArrowRight') select($('#next').dataset.go); if(selected && e.key==='ArrowLeft') select($('#prev').dataset.go); });

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const pick = e => { const r = renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ptr,camera); const h = ray.intersectObjects(pickables,false)[0]; return h ? h.object.userData.zoneId : null; };
let down = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { down = {x:e.clientX,y:e.clientY}; lastInteract = performance.now(); });
cv.addEventListener('pointermove', e => { hoverId = down ? null : pick(e); cv.style.cursor = hoverId ? 'pointer' : ''; if(hoverId) showTip(hoverId,e.clientX,e.clientY); else hideTip(); });
cv.addEventListener('pointerup', e => { if(down && Math.hypot(e.clientX-down.x,e.clientY-down.y) < 5){ const id = pick(e); if(id) select(id); } down = null; });
cv.addEventListener('pointerleave', () => { hoverId = null; hideTip(); });
window.__htp = { select, overview };

function resize(){ const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w,h); labelR.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); offCur = 1e9; }
new ResizeObserver(resize).observe(stage); addEventListener('resize', resize); resize();

const side = $('#side');
const clock = new THREE.Clock(); let t0 = null;
const zlist = Object.values(zones);
let lastOff = null;
function loop(){
 requestAnimationFrame(loop);
 if(renderer.domElement.width === 0){ if(stage.clientWidth > 0) resize(); else return; }
 const now = performance.now();
 if(t0 === null){ t0 = now; clock.start(); flyTo(OV_P.clone(), OV_T.clone(), 2800); }
 const t = clock.getElapsedTime();
 if(tween){ const k = Math.min(1,(now-tween.s)/tween.dur), e = ease(k); camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); camera.lookAt(controls.target); if(k>=1) tween = null; }
 else { controls.autoRotate = autoRot && !selected && now-lastInteract > 4000; controls.update(); }
 const tg = controls.target; tg.x = THREE.MathUtils.clamp(tg.x,-42,42); tg.z = THREE.MathUtils.clamp(tg.z,-38,30); tg.y = THREE.MathUtils.clamp(tg.y,0,14);
 const w = stage.clientWidth, h = stage.clientHeight;
 const offT = ((panel.classList.contains('is-open') ? panel.offsetWidth : 0) - side.offsetWidth)/2;
 offCur = offCur > 1e8 ? offT : offCur + (offT-offCur)*.08;
 if(lastOff===null || Math.abs(offCur-lastOff) > .05){ camera.setViewOffset(w,h,offCur,0,w,h); lastOff = offCur; }
 const hv = hoverLbl || hoverId;
 zlist.forEach(Z => {
  const k = THREE.MathUtils.clamp((now-t0-Z.delay)/1000,0,1), r = 1-Math.pow(1-k,3);
  const on = Z.id===selected || Z.id===hv;
  Z.act += ((on?1:0)-Z.act)*.14;
  Z.inner.position.y = Z.rise*(1-r) + Z.act*(Z.id==='conn'?.15:.55);
  Z.edgeMat.color.copy(INK).lerp(RED,Z.act);
  if(k>.85 && !Z.shown){ Z.el.style.opacity = 1; Z.shown = true; }
  if(on !== Z.on){ Z.el.classList.toggle('on',on); Z.on = on; }
 });
 if(!flowGroup.visible && now-t0 > 2600) flowGroup.visible = true;
 anims.forEach(f => f(t));
 renderer.render(scene,camera); labelR.render(scene,camera);
}
loop();
setTimeout(() => { const l = $('#loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 650); }, 350);
</script>
